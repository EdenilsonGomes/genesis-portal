<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gênesis — recrutamento conversacional</title>
  <desc id="desc">Aquisição, triagem e entrevistas em um fluxo controlado</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="1160" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#06131F"/><stop offset=".54" stop-color="#10243A"/><stop offset="1" stop-color="#182050"/></linearGradient>
    <linearGradient id="signal" x1="80" y1="80" x2="230" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#28E0BD"/><stop offset="1" stop-color="#7B70FF"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#28E0BD"/><stop offset="1" stop-color="#7B70FF"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="60" r="310" fill="#7B70FF" opacity=".12"/>
  <circle cx="170" cy="650" r="300" fill="#28E0BD" opacity=".08"/>
  <rect x="74" y="72" width="74" height="74" rx="21" fill="#0B1A29" stroke="#29445B"/>
